<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Datos y QR · Franco Vinzón</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E3A5F;--gold:#D4A24C;--cream:#FAF9F6;--line:#E9E4D8;--text:#2A2A2A;--muted:#625f57;--red:#a52d25}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font:16px/1.45 Inter,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #d4a24c88;outline-offset:2px}.hidden,[hidden]{display:none!important}
#login{min-height:100dvh;display:grid;place-items:center;padding:22px}.login-card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px #1e3a5f0c}.login-card{width:min(100%,380px);padding:28px}.login-card h1,h1,h2{font-family:Fraunces,Georgia,serif;color:var(--navy)}.login-card h1{text-align:center;font-size:26px}.login-card p{text-align:center;color:var(--muted)}.login-card input{width:100%;min-height:54px;border:2px solid #c9c3b5;border-radius:11px;padding:12px;margin:8px 0}.primary{background:var(--navy);color:white;border:0;border-radius:11px;font-weight:700;min-height:54px;padding:12px 18px}.login-card .primary{width:100%}.error{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
main{width:min(100%,680px);margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 40px}.top{display:flex;align-items:center;gap:12px;margin:0 2px 16px}.top h1{font-size:26px;margin:0;flex:1}.quiet{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;min-height:44px;padding:8px 13px;font-weight:700}.tools{display:flex;gap:9px;margin-bottom:12px}.tools input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;background:white;min-height:48px}.refresh{width:48px;height:48px;border:1px solid var(--navy);border-radius:11px;background:white;color:var(--navy);font-size:20px}.state{padding:28px;text-align:center;color:var(--muted)}.state button{margin-top:12px}.day{margin:14px 0 0}.day-title{position:sticky;top:0;z-index:2;background:var(--cream);padding:10px 4px 8px;font-size:13px;font-weight:700;text-transform:capitalize;color:var(--muted);border-bottom:1px solid var(--line)}.rows{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.row{display:flex;align-items:center;gap:10px;min-height:64px;padding:7px 9px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row.dim{opacity:.58}.time{width:48px;flex:none;text-align:center;color:var(--navy);font-weight:700;font-size:14px}.name{flex:1;min-width:0;min-height:48px;text-align:left;border:0;background:transparent;color:var(--navy);font-weight:700;font-size:16px;padding:8px 2px;overflow-wrap:anywhere}.no-file{font-size:11px;color:#756b59;background:#f6f1e7;border-radius:20px;padding:5px 8px;white-space:nowrap}.qr-mini{width:48px;height:48px;flex:none;border:1.5px solid var(--gold);border-radius:10px;background:white;color:var(--navy);display:grid;place-items:center}.qr-mini svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2}
#overlay{position:fixed;inset:0;background:#1119;z-index:10;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top)}.sheet{width:min(100%,680px);max-height:calc(100dvh - env(safe-area-inset-top));overflow:auto;background:var(--cream);border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 35px #0002}.sheet-head{display:flex;align-items:flex-start;gap:10px}.sheet-head h2{font-size:25px;margin:0 0 8px;flex:1}.close{width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:var(--navy);font-size:25px}.field{margin:0 0 14px}.field label{display:block;color:var(--navy);font-weight:700;margin-bottom:6px}.field input{width:100%;min-height:54px;padding:11px 13px;border:2px solid #c9c3b5;border-radius:11px;background:#fff;font-size:17px}.field-error{color:var(--red);font-weight:600;font-size:13px;min-height:0;margin-top:4px}.field-error:not(:empty){min-height:18px}.sheet-actions{display:flex;align-items:center;gap:10px;margin-top:16px}.sheet-actions .primary{flex:1}.qr-link{border:1.5px solid var(--gold);background:#fff;color:var(--navy);height:44px;padding:0 15px;border-radius:10px;font-weight:700}.qr-sheet{text-align:center;background:#fff;min-height:calc(100dvh - env(safe-area-inset-top));padding-top:calc(22px + env(safe-area-inset-top));}.qr-sheet .sheet-head{text-align:left}.qr-instruction{color:var(--muted);margin:8px auto 18px;max-width:350px}.qr-frame{display:grid;place-items:center;background:white;width:min(82vw,340px);height:min(82vw,340px);min-width:260px;min-height:260px;margin:16px auto 20px;padding:20px;box-shadow:0 1px 8px #1e3a5f18;border:1px solid var(--line);border-radius:12px}.qr-frame svg{width:100%;height:100%;display:block}.qr-sheet .primary{width:100%;max-width:360px}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:white;padding:12px 20px;border-radius:24px;z-index:20;box-shadow:0 4px 18px #0003}
  html.embed header.top, html.embed .tools, html.embed #list{display:none!important}
  html.embed body{background:#fff}
.cob-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field .cob-op{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;margin:0;min-height:58px;padding:10px 12px;border:2px solid #c9c3b5;border-radius:14px;background:#fff;color:var(--navy);font-weight:700;font-size:1em;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}.field .cob-op input{position:absolute;opacity:0;width:100%;height:100%;inset:0;margin:0;min-height:0;cursor:pointer}.field .cob-op:has(input:checked){border-color:#1E3A5F;background:#1E3A5F;color:#fff}.field .cob-op:has(input:checked) span::before{content:'✓ '}.field .cob-op:has(input:focus-visible){outline:3px solid #D4A24C;outline-offset:2px}
</style>
</head>
<body>
<section id="login" hidden><form class="login-card" id="loginForm"><h1>Acceso secretaria</h1><p>Ingresá la clave de gestión para ver los turnos.</p><label for="keyInput">Clave</label><input id="keyInput" type="password" autocomplete="current-password" required><button class="primary" type="submit">Ingresar</button><div id="loginError" class="error" role="alert"></div></form></section>
<main id="app" hidden><header class="top"><h1>Datos y QR</h1><button class="quiet" id="logout" type="button">Salir</button></header><div class="tools"><label for="search" class="hidden">Buscar paciente por nombre</label><input id="search" type="search" placeholder="Buscar por nombre…" autocomplete="off"><button class="refresh" id="refresh" type="button" aria-label="Actualizar turnos" title="Actualizar">↻</button></div><div id="list" aria-live="polite"></div></main>
<div id="overlay" hidden><section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section></div><div id="toast" class="toast" role="status" hidden>Guardado</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = (s,root=document) => root.querySelector(s), list=$('#list'), overlay=$('#overlay'), sheet=$('#sheet');
  let key=sessionStorage.getItem('gestionKey')||'', items=[], activePatient=null;
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const parts=(date)=>Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
  const dateKey=(date)=>{const p=parts(date);return `${p.year}-${p.month}-${p.day}`};
  const todayKey=()=>dateKey(new Date());
  const addDaysKey=(key,n)=>{const [y,m,d]=key.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d+n,12));return dateKey(dt)};
  const dayLabel=(k)=>{if(k===todayKey())return 'Hoy';if(k===addDaysKey(todayKey(),1))return 'Mañana';const [y,m,d]=k.split('-').map(Number);return new Intl.DateTimeFormat('es-AR',{timeZone:'UTC',weekday:'short',day:'numeric',month:'long'}).format(new Date(Date.UTC(y,m-1,d,12))).replace(/^\w/,c=>c.toUpperCase())};
  const timeLabel=(v)=>new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(v));
  const normalized=(s)=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  function showLogin(message=''){ $('#app').hidden=true;$('#login').hidden=false;$('#loginError').textContent=message;$('#keyInput').focus(); }
  function showApp(){ $('#login').hidden=true;$('#app').hidden=false; }
  function clearKey(){key='';sessionStorage.removeItem('gestionKey');showLogin('La clave no es válida. Ingresala de nuevo.');}
  async function fetchJson(url,options={}){const r=await fetch(url,{cache:'no-store',...options});const data=await r.json().catch(()=>({}));if(r.status===401){clearKey();throw new Error('unauthorized')}if(!r.ok)throw new Error(data.error||'No se pudo completar la solicitud.');return data}
  function status(text,button=false){list.replaceChildren();const box=document.createElement('div');box.className='panel state';box.textContent=text;if(button){const b=document.createElement('button');b.className='quiet';b.textContent='Reintentar';b.addEventListener('click',loadTurns);box.append(b)}list.append(box)}
  async function loadTurns(){if(!key){showLogin();return}status('Cargando turnos…');$('#refresh').disabled=true;try{const data=await fetchJson(`/api/gestion/turnos-dia?date=${encodeURIComponent(todayKey())}&dias=14&key=${encodeURIComponent(key)}`,{headers:{Accept:'application/json'}});if(!Array.isArray(data))throw new Error('La respuesta de turnos no tiene el formato esperado.');items=collapsePatients(data);render()}catch(e){if(e.message!=='unauthorized')status('No pudimos cargar los turnos. Revisá tu conexión e intentá de nuevo.',true)}finally{$('#refresh').disabled=false}}
  function collapsePatients(data){const chosen=new Map();for(const item of data){if(!item||item.tipo==='bloqueo'||item.allDay||item.all_day)continue;const start=new Date(item.start);if(!Number.isFinite(start.getTime()))continue;const name=String(item.title||'Paciente').trim();const k=item.fichaId||item.dni||normalized(name);const previous=chosen.get(String(k));if(!previous||start<new Date(previous.start))chosen.set(String(k),{...item,title:name,_start:start})}return [...chosen.values()].sort((a,b)=>a._start-b._start)}
  function render(){const query=normalized($('#search').value);const filtered=items.filter(x=>normalized(x.title).includes(query));if(!filtered.length){status(query?'No hay pacientes que coincidan con la búsqueda.':'No hay turnos próximos.');return}const groups=new Map();for(const item of filtered){const k=dateKey(item._start);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(item)}list.replaceChildren();for(const [date,rows] of groups){const section=document.createElement('section');section.className='day';const heading=document.createElement('h2');heading.className='day-title';heading.textContent=dayLabel(date);section.append(heading);const box=document.createElement('div');box.className='rows';for(const item of rows){const row=document.createElement('div');row.className='row'+(item.fichaId?'':' dim');const time=document.createElement('time');time.className='time';time.dateTime=item.start;time.textContent=timeLabel(item.start);const name=document.createElement('button');name.type='button';name.className='name';name.textContent=item.title;name.setAttribute('aria-label',item.fichaId?`Abrir datos de ${item.title}`:`${item.title}, sin ficha`);if(item.fichaId)name.addEventListener('click',()=>openEditor(item));else{name.disabled=true;const tag=document.createElement('span');tag.className='no-file';tag.textContent='Sin ficha';row.append(time,name,tag);box.append(row);continue}row.append(time,name);const qr=document.createElement('button');qr.type='button';qr.className='qr-mini';qr.setAttribute('aria-label',`Mostrar QR de ${item.title}`);qr.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM19 14h2v2h-2zM19 19h2v2h-2zM14 19h2v2h-2z"/></svg>';qr.addEventListener('click',()=>openQr(item));row.append(qr);box.append(row)}section.append(box);list.append(section)}}
  var closeSheet=function(){overlay.hidden=true;sheet.replaceChildren();document.body.style.overflow=''}
  function openSheet(html,klass=''){sheet.className=`sheet ${klass}`;sheet.innerHTML=html;overlay.hidden=false;document.body.style.overflow='hidden';const close=$('.close',sheet);if(close)close.addEventListener('click',closeSheet);overlay.onclick=e=>{if(e.target===overlay)closeSheet()}}
  $('#loginForm').addEventListener('submit',e=>{e.preventDefault();key=$('#keyInput').value.trim();if(!key)return;sessionStorage.setItem('gestionKey',key);showApp();loadTurns()});
  $('#logout').addEventListener('click',()=>{sessionStorage.removeItem('gestionKey');key='';items=[];showLogin()});$('#refresh').addEventListener('click',loadTurns);$('#search').addEventListener('input',render);
  // Modo incrustado: /gestion abre esta página en un iframe con ?editar=<fichaId>&n=<nombre>
  // para mostrar solo el editor de datos (con el botón QR adentro), sin la lista.
  const qs=new URLSearchParams(location.search), embedFicha=qs.get('editar');
  if(embedFicha&&key){
    document.documentElement.classList.add('embed');
    showApp();
    list.replaceChildren();
    const _closeSheet=closeSheet;
    closeSheet=function(){_closeSheet();try{parent.postMessage({tipo:'datosqr-cerrar'},location.origin)}catch(e){}};
    openEditor({title:qs.get('n')||'Paciente',fichaId:embedFicha});
  } else if(key){showApp();loadTurns()}else showLogin();


  // ===== COBERTURA: particular u obra social =====
  // Pregunta primero cómo se atiende. "Particular" oculta obra social, afiliado y plan y
  // guarda obraSocial = PARTICULAR (lo que ya usan las fichas). "Con obra social" los muestra.
  // Nunca borra datos: si ya tenía afiliado/plan y marca Particular, solo se ocultan.
  function aplicarCobertura(cont){
    const q=(n)=>cont.querySelector('input[name="'+n+'"]');
    const os=q('obraSocial'),af=q('nAfiliado'),pl=q('plan'); if(!os||!af||!pl) return;
    const wOs=os.closest('.field'),wAf=af.closest('.field'),wPl=pl.closest('.field');
    const original=os.value.trim(), esPart=/^particular$/i.test(original);
    const box=document.createElement('div'); box.className='field cobertura';
    box.innerHTML='<label id="cob-l">¿Cómo te atendés?</label><div class="cob-opts" role="radiogroup" aria-labelledby="cob-l"><label class="cob-op"><input type="radio" name="cobertura" value="particular"><span>Particular</span></label><label class="cob-op"><input type="radio" name="cobertura" value="os"><span>Con obra social</span></label></div>';
    wOs.before(box);
    const mostrar=(v)=>{ const ver=v==='os'; wOs.style.display=wAf.style.display=wPl.style.display=ver?'':'none'; };
    const elegir=(v)=>{
      mostrar(v);
      if(v==='particular'&&!/^particular$/i.test(os.value.trim())) os.value='PARTICULAR';
      if(v==='os'&&/^particular$/i.test(os.value.trim())) os.value='';
    };
    box.querySelectorAll('input').forEach((r)=>r.addEventListener('change',()=>elegir(r.value)));
    const ini=esPart?'particular':(original?'os':'');
    if(ini){ box.querySelector('input[value="'+ini+'"]').checked=true; mostrar(ini); } else mostrar('');
    cont.dataset.cobOriginal=original;
  }
  // Antes de guardar: si eligió "Con obra social" pero dejó la obra social vacía, se restaura
  // el valor original (para no borrar PARTICULAR por accidente).
  function cobFix(cont){
    const os=cont.querySelector('input[name="obraSocial"]'); if(!os) return;
    const sel=cont.querySelector('input[name="cobertura"]:checked');
    if(sel&&sel.value==='os'&&!os.value.trim()) os.value=cont.dataset.cobOriginal||'';
  }
  // ===== EDITOR DE DATOS =====
  async function openEditor(patient){activePatient=patient;openSheet(`<div class="sheet-head"><h2 id="sheetTitle">Datos de ${esc(patient.title)}</h2><button class="close" type="button" aria-label="Cerrar">×</button></div><div class="state">Cargando datos…</div>`);try{const data=await fetchJson(`/api/gestion/pacientes?modo=datos-ficha&fichaId=${encodeURIComponent(patient.fichaId)}&key=${encodeURIComponent(key)}`,{headers:{Accept:'application/json'}});if(!data.ok||!Array.isArray(data.campos))throw new Error('No pudimos cargar los datos.');renderEditor(patient,data.campos)}catch(e){if(e.message!=='unauthorized'&&!overlay.hidden)openSheet(`<div class="sheet-head"><h2 id="sheetTitle">Datos de ${esc(patient.title)}</h2><button class="close" type="button" aria-label="Cerrar">×</button></div><p class="error">${esc(e.message)}</p><button class="quiet" id="editorRetry" type="button">Reintentar</button>`);$('#editorRetry')?.addEventListener('click',()=>openEditor(patient))}}
  function renderEditor(patient,campos){const form=document.createElement('form');form.id='editorForm';form.noValidate=true;const head=document.createElement('div');head.className='sheet-head';const title=document.createElement('h2');title.id='sheetTitle';title.textContent=`Datos de ${patient.title}`;const close=document.createElement('button');close.type='button';close.className='close';close.setAttribute('aria-label','Cerrar');close.textContent='×';close.addEventListener('click',closeSheet);head.append(title,close);const fields=document.createElement('div');fields.id='editorFields';campos.forEach(c=>{const wrap=document.createElement('div');wrap.className='field';const id=`field-${c.clave}`;const label=document.createElement('label');label.htmlFor=id;label.textContent=c.etiqueta;const input=document.createElement('input');input.id=id;input.name=c.clave;input.type=c.tipo==='tel'?'tel':'text';input.autocomplete=c.autocomplete||'off';input.maxLength=120;input.value=c.valor??'';input.dataset.original=input.value;if(c.clave==='telefono')input.inputMode='tel';if(c.clave==='localidad'&&window.ComboLocalidad){wrap.style.position='relative';setTimeout(()=>window.ComboLocalidad.attach(input),0)}if(c.clave==='dni')input.inputMode='numeric';if(c.clave==='fechaNacimiento'&&window.FechaNacimiento){setTimeout(()=>window.FechaNacimiento.attach(input),0)}const err=document.createElement('div');err.className='field-error';err.id=`error-${c.clave}`;err.setAttribute('aria-live','polite');input.setAttribute('aria-describedby',err.id);wrap.append(label,input,err);fields.append(wrap)});aplicarCobertura(fields);const globalError=document.createElement('div');globalError.className='error';globalError.id='editorError';globalError.setAttribute('role','alert');const actions=document.createElement('div');actions.className='sheet-actions';const save=document.createElement('button');save.className='primary';save.type='submit';save.textContent='Guardar';const qr=document.createElement('button');qr.className='qr-link';qr.type='button';qr.textContent='QR';qr.addEventListener('click',()=>openQr(patient));actions.append(save,qr);form.append(head,fields,globalError,actions);sheet.replaceChildren(form);form.addEventListener('submit',async e=>{e.preventDefault();cobFix(fields);globalError.textContent='';fields.querySelectorAll('.field-error').forEach(n=>n.textContent='');const cambios={};fields.querySelectorAll('input').forEach(input=>{if(input.type==='radio'||input.dataset.original===undefined)return;if(input.value.trim()!==input.dataset.original.trim())cambios[input.name]=input.value});if(fields.querySelector('[data-fn-incompleta]')){globalError.textContent='Completá día, mes y año de nacimiento (o dejalos vacíos).';return}save.disabled=true;save.textContent='Guardando…';try{const data=await fetchJson('/api/gestion/pacientes',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({key,accion:'datos-guardar',fichaId:patient.fichaId,cambios})});if(data.errores){for(const [clave,msg] of Object.entries(data.errores)){const input=fields.querySelector(`[name="${CSS.escape(clave)}"]`);const err=$(`#error-${CSS.escape(clave)}`,fields);if(input&&err){err.textContent=msg;input.setAttribute('aria-invalid','true')}}globalError.textContent='Revisá los campos marcados.';return}fields.querySelectorAll('input').forEach(input=>{if(input.type!=='radio'&&input.dataset.original!==undefined)input.dataset.original=input.value});toast('✓ Datos guardados con éxito');setTimeout(()=>{if(typeof closeSheet==='function')closeSheet()},1100)}catch(err){if(err.message!=='unauthorized')globalError.textContent=err.message||'No pudimos guardar los cambios.'}finally{save.disabled=false;save.textContent='Guardar'}})}
  // ===== SHEET QR =====
  async function openQr(patient){activePatient=patient;openSheet(`<div class="sheet-head"><h2 id="sheetTitle">QR de ${esc(patient.title)}</h2><button class="close" type="button" aria-label="Cerrar">×</button></div><p class="qr-instruction">Mostrale este código al paciente. Escanea con la cámara. Vale 3 horas.</p><div class="qr-frame" id="qrFrame" aria-label="Código QR" aria-live="polite"><span>Cargando QR…</span></div><button class="primary" id="qrClose" type="button">Cerrar</button>`,'qr-sheet');$('#qrClose').addEventListener('click',closeSheet);try{const data=await fetchJson('/api/gestion/pacientes',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({key,accion:'autoficha-token',fichaId:patient.fichaId})});if(!data.url)throw new Error('No se recibió el enlace del QR.');if(typeof qrcode!=='function')throw new Error('No se pudo cargar el generador QR.');const qr=qrcode(0,'M');qr.addData(data.url);qr.make();const frame=$('#qrFrame');if(frame&&!overlay.hidden)frame.innerHTML=qr.createSvgTag(8,4)}catch(e){const frame=$('#qrFrame');if(frame&&!overlay.hidden)frame.textContent=e.message==='unauthorized'?'La sesión venció. Ingresá la clave otra vez.':'No pudimos generar el QR. Cerrá e intentá de nuevo.'}}
  function toast(message){const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,2200)}
})();
</script>
<script src="/assets/combo-localidad.js"></script>
<script src="/assets/fecha-nacimiento.js"></script>
</body>
</html>
